<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone sheet up, D21</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8FA8FF}a:hover{color:#B7C7FF}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #1A1E22; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #F2F3F1">

<svg aria-hidden="true" viewBox="0 0 390 200" style="position: absolute; left: 0; top: 0; width: 390px; height: 200px"><path d="M0 120 C120 100 240 150 390 110 M190 0 C200 80 170 140 210 200" stroke="#2D3339" stroke-width="9" fill="none"></path><path d="M0 60 L390 70 M80 0 L100 200 M290 0 L280 200" stroke="#24292E" stroke-width="3" fill="none"></path></svg>
<div style="position: absolute; left: 70px; top: 80px; padding: 4px 9px; border-radius: 999px; background: #2FBF96; color: #06231A; font-size: 12px; font-weight: 800">₹2,000</div>
<div style="position: absolute; left: 250px; top: 60px; padding: 4px 9px; border-radius: 999px; background: #F2F3F1; color: #0E1012; font-size: 12px; font-weight: 800">₹1,200</div>

<section aria-label="Work near you" style="position: absolute; left: 0; right: 0; top: 130px; bottom: 72px; border-radius: 26px 26px 0 0; background: #16191C; border-top: 1px solid #2A2F34; box-sizing: border-box; padding: 8px 16px 0; display: flex; flex-direction: column; gap: 12px">
<div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #2A2F34"></div>
<div style="display: flex; align-items: center; gap: 8px">
<h1 style="flex: 1; margin: 0; font-size: 19px; font-weight: 800">Work near you</h1>
<div aria-label="How far" style="display: flex; padding: 3px; border-radius: 13px; background: #1E2226">
<button style="height: 28px; padding: 0 9px; border-radius: 10px; border: 0; background: transparent; color: #9AA0A6; font-size: 11.5px; font-weight: 700">5</button>
<button style="height: 28px; padding: 0 9px; border-radius: 10px; border: 0; background: transparent; color: #9AA0A6; font-size: 11.5px; font-weight: 700">10</button>
<button style="height: 28px; padding: 0 9px; border-radius: 10px; border: 0; background: #2A2F34; color: #F2F3F1; font-size: 11.5px; font-weight: 800">25 km</button>
</div>
</div>

<div style="display: flex; align-items: center; gap: 18px; border-bottom: 1px solid #2A2F34">
<button style="height: 34px; padding: 0; border: 0; border-bottom: 2px solid #2FBF96; background: transparent; color: #F2F3F1; font-size: 13px; font-weight: 800">Jobs · 15</button>
<button style="height: 34px; padding: 0; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #9AA0A6; font-size: 13px; font-weight: 700">Best-paying areas</button>
</div>

<div style="flex: 1; min-height: 0; position: relative; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{areas}}" as="a" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: baseline; gap: 8px">
<span style="flex: 1; font-size: 14px; font-weight: 800">{{a.name}}</span>
<span style="font-size: 11.5px; font-weight: 600; color: #9AA0A6">{{a.meta}}</span>
<span style="font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums">{{a.price}}</span>
</div>
<div style="height: 8px; border-radius: 4px; background: #1E2226; overflow: hidden"><div style="height: 8px; border-radius: 4px; width: {{a.w}}; background: {{a.fill}}"></div></div>
</div>
</sc-for>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: linear-gradient(rgba(22,25,28,0), #16191C 75%)"></div>
</div>
</section>

<nav aria-label="Tabs" style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; background: #0E1012; border-top: 1px solid #1E2226; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; text-align: center; font-size: 11px; font-weight: 700">
<a href="#" style="color: #9AA0A6; text-decoration: none">Home</a>
<a href="#" aria-current="page" style="color: #57D1AE; text-decoration: none; font-weight: 800">Find work</a>
<a href="#" style="color: #9AA0A6; text-decoration: none">My Work</a>
<a href="#" style="color: #9AA0A6; text-decoration: none">Wallet</a>
<a href="#" style="color: #9AA0A6; text-decoration: none">Profile</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const a = (name, meta, price, w, top) => ({ name, meta, price, w, fill: top ? '#2FBF96' : '#3A4248' });
    return {
      areas: [
        a('Financial District', '12 jobs · 5 km', '₹2,000', '100%', true),
        a('Manikonda', '1 job · 4.7 km', '₹1,500', '75%'),
        a('Dilsukhnagar', '2 jobs · 18 km', '₹1,300', '65%'),
        a('Gachibowli', '2 jobs · 2.2 km', '₹1,200', '60%'),
        a('Mehdipatnam', '4 jobs · 9 km', '₹1,100', '55%'),
        a('Ameerpet', '2 jobs · 12 km', '₹950', '48%'),
        a('Shamshabad', '1 job · 21 km', '₹800', '40%'),
        a('Madhapur', '3 jobs · 3 km', '₹500', '25%')
      ]
    };
  }
}
</script>
</body>
</html>
