<title>TaskDrop Tour Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Clickable prototype of the approved tour (design v2). Phone centred, controls above it.
   Tokens copied from apps/mobile/src/theme.ts (redesigned-2.0). */
:root{
  --bg:#F3F4F1;--surface:#FFFFFF;--surface2:#ECEEE9;--line:#E2E5DF;--ink:#121417;--text:#3F444A;--muted:#5F6368;
  --accent:#0E8F72;--accentDeep:#0A6F58;--accentSoft:#E7F5EF;--gold:#E0A85A;--goldSoft:#FBF1E0;--goldInk:#8A5A12;
  --signal:#E0724A;--purple:#2F5BEA;--purpleDeep:#1E40AF;--purpleSoft:#EAF0FE;--online:#12804A;
  --btn:#0A6F58;--onBtn:#FFFFFF;--earnBtn:#1E40AF;--earnOn:#FFFFFF;--heroFrom:#0D8A6F;--heroTo:#064A3B;
  --cardShadow:0 1px 2px rgba(18,20,23,.06),0 6px 18px rgba(18,20,23,.06);--cardBorder:transparent;
  --pageBg:#E9EBE6;--pageInk:#121417;--pageMuted:#5F6368;--pageCard:#FFFFFF;--pageLine:#D9DDD5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1012;--surface:#16191C;--surface2:#1E2226;--line:#2A2F34;--ink:#F2F3F1;--text:#C9CDD2;--muted:#9AA0A6;
    --accent:#2FBF96;--accentDeep:#57D1AE;--accentSoft:#12271F;--gold:#E0A85A;--goldSoft:#2A2216;--goldInk:#E8BE80;
    --signal:#E0724A;--purple:#6B8CFF;--purpleDeep:#4F6FE8;--purpleSoft:#172036;--online:#4ADE9A;
    --btn:#2FBF96;--onBtn:#04140D;--earnBtn:#6B8CFF;--earnOn:#0B1020;--heroFrom:#0E8F72;--heroTo:#06372C;
    --cardShadow:none;--cardBorder:#2A2F34;
    --pageBg:#08090B;--pageInk:#F2F3F1;--pageMuted:#9AA0A6;--pageCard:#14171A;--pageLine:#262B30;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1012;--surface:#16191C;--surface2:#1E2226;--line:#2A2F34;--ink:#F2F3F1;--text:#C9CDD2;--muted:#9AA0A6;
  --accent:#2FBF96;--accentDeep:#57D1AE;--accentSoft:#12271F;--gold:#E0A85A;--goldSoft:#2A2216;--goldInk:#E8BE80;
  --signal:#E0724A;--purple:#6B8CFF;--purpleDeep:#4F6FE8;--purpleSoft:#172036;--online:#4ADE9A;
  --btn:#2FBF96;--onBtn:#04140D;--earnBtn:#6B8CFF;--earnOn:#0B1020;--heroFrom:#0E8F72;--heroTo:#06372C;
  --cardShadow:none;--cardBorder:#2A2F34;
  --pageBg:#08090B;--pageInk:#F2F3F1;--pageMuted:#9AA0A6;--pageCard:#14171A;--pageLine:#262B30;
  color-scheme:dark;
}
@property --fill{syntax:'<number>';inherits:true;initial-value:0}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--pageBg);color:var(--pageInk);font:14px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
.bar{width:100%;max-width:560px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 10px;margin-bottom:10px}
.bar .nm{font-weight:800;font-size:15px;letter-spacing:-.3px;margin-right:auto}
.bar .nm i{font-style:normal;color:var(--accent)}
.bar .nm small{font-weight:700;font-size:10.5px;letter-spacing:.08em;color:var(--goldInk);background:var(--goldSoft);padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:2px}
.seg{display:inline-flex;align-items:center;background:var(--pageCard);border:1px solid var(--pageLine);border-radius:999px;padding:3px}
.seg span{font-size:11.5px;font-weight:700;color:var(--pageMuted);padding:0 6px 0 8px}
.seg button,.rs{border:0;background:transparent;color:var(--pageMuted);font:700 13px 'Plus Jakarta Sans',system-ui,sans-serif;padding:7px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--onBtn)}
.seg button[data-a="earn"][aria-pressed="true"]{background:var(--earnBtn);color:var(--earnOn)}
.rs{background:var(--pageCard);border:1px solid var(--pageLine);color:var(--pageInk)}
.seg button:focus-visible,.rs:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.help{max-width:560px;text-align:center;color:var(--pageMuted);font-size:12.5px;margin:-2px 0 10px}
.stagewrap{position:relative;flex:none}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}

/* ---------- Phone (same as TOUR_DESIGN_V2.html) ---------- */
.phone{width:380px;height:780px;border-radius:54px;padding:10px;background:#0A0B0C;box-shadow:0 30px 60px rgba(0,0,0,.25),inset 0 0 0 2px #2a2d31;
  --acc:var(--accent);--accSoft:var(--accentSoft);--accBtn:var(--btn);--accOn:var(--onBtn);--heroA:var(--heroFrom);--heroB:var(--heroTo)}
.bare .phone{width:360px;height:760px;padding:0;background:none;box-shadow:none;border-radius:26px}
.bare .screen{border-radius:26px}
.phone[data-mode="earn"]{--acc:var(--purple);--accSoft:var(--purpleSoft);--accBtn:var(--earnBtn);--accOn:var(--earnOn);--heroA:#2F5BEA;--heroB:#1A2F86}
.screen{position:relative;width:360px;height:760px;border-radius:44px;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
.screen svg{display:block}
.tc{transition:background-color .25s,color .25s,border-color .25s}
.phone[data-mode="hire"] .when-earn,.phone[data-mode="earn"] .when-hire{display:none}
.tgt{cursor:pointer}

.sb{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font:700 13px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);position:relative}
.sb::after{content:'';position:absolute;left:50%;top:9px;width:92px;height:24px;margin-left:-46px;background:#000;border-radius:14px}
.bare .sb::after{display:none}
.sb .bat i{display:block;width:22px;height:11px;border:1.5px solid var(--ink);border-radius:3px;position:relative}
.sb .bat i::after{content:'';position:absolute;inset:1.5px;right:5px;background:var(--ink);border-radius:1px}

.hd{position:absolute;top:36px;left:0;right:0;height:52px;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px}
.wm{font:800 19px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);letter-spacing:-.6px}
.wm i{font-style:normal;color:var(--accent)}
.ms{position:relative;display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px;margin-left:2px}
.ms b{position:relative;z-index:1;width:50px;text-align:center;font:800 12px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--muted);padding:5px 0;border-radius:999px;transition:color .25s}
.ms .k{position:absolute;top:3px;bottom:3px;left:3px;width:50px;border-radius:999px;background:var(--accBtn);transition:left .25s cubic-bezier(.2,.8,.2,1),background-color .25s}
.phone[data-mode="earn"] .ms .k{left:53px}
.phone[data-mode="hire"] .ms b[data-m="hire"],.phone[data-mode="earn"] .ms b[data-m="earn"]{color:var(--accOn)}
.tools{margin-left:auto;display:flex;align-items:center;gap:2px;padding:2px;border-radius:16px}
.ic{width:34px;height:34px;display:grid;place-items:center;color:var(--ink);position:relative}
.ic svg{width:21px;height:21px}
.ic .bd{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--signal);transform:scale(0);transition:transform .25s cubic-bezier(.2,1.6,.4,1)}
.ic.has .bd{transform:scale(1)}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#E0A85A,#B4512C);color:#fff;font:800 13px 'Plus Jakarta Sans',system-ui,sans-serif;display:grid;place-items:center;position:relative;margin-left:2px}
.av::after{content:'';position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:var(--online);border:2px solid var(--bg)}

.body{position:absolute;top:88px;left:0;right:0;bottom:64px;padding:2px 14px;overflow:hidden}
.area{display:flex;align-items:center;gap:6px;font:700 12.5px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--muted);margin:4px 2px 10px}
.area svg{width:14px;height:14px;color:var(--acc)}
.hero{border-radius:22px;padding:16px;background:linear-gradient(135deg,var(--heroA),var(--heroB));color:#fff}
.hero .eb{font:700 10.5px 'Plus Jakarta Sans',system-ui,sans-serif;letter-spacing:.12em;opacity:.85}
.hero h4{font:800 26px 'Plus Jakarta Sans',system-ui,sans-serif;letter-spacing:-.9px;margin:6px 0 12px;color:#fff}
.hero .in{background:#fff;color:#5F6368;border-radius:14px;padding:11px 12px;font:500 13px 'Plus Jakarta Sans',system-ui,sans-serif;display:flex;justify-content:space-between;align-items:center}
.hero .in i{width:24px;height:24px;border-radius:50%;background:var(--accBtn);display:grid;place-items:center}
.hero .in i svg{width:13px;height:13px;color:var(--accOn)}
.hero .chips2{display:flex;gap:6px}
.hero .chips2 span{background:rgba(255,255,255,.18);border-radius:999px;padding:6px 10px;font:700 12px 'Plus Jakarta Sans',system-ui,sans-serif}
.how{margin-top:12px;background:var(--surface);border:1px solid var(--cardBorder);box-shadow:var(--cardShadow);border-radius:18px;padding:11px 12px;display:flex;gap:10px;align-items:center}
.how .sq{width:36px;height:36px;border-radius:12px;background:var(--accSoft);display:grid;place-items:center;color:var(--acc)}
.how .sq svg{width:20px;height:20px}
.how b{display:block;font:800 13.5px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink)}
.how span{font-size:11.5px;color:var(--muted)}
.sec{font:800 15px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);margin:14px 2px 8px;letter-spacing:-.3px}
.sec small{display:block;font:400 11.5px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--muted);letter-spacing:0;margin-top:1px}
.row{background:var(--surface);border:1px solid var(--cardBorder);box-shadow:var(--cardShadow);border-radius:18px;padding:10px 12px;display:flex;gap:10px;align-items:center;margin-bottom:8px}
.row .th{width:44px;height:44px;border-radius:12px;background:var(--surface2);flex:none;display:grid;place-items:center;color:var(--muted)}
.row .th svg{width:20px;height:20px}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font:700 13.5px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx span{font-size:11.5px;color:var(--muted)}
.row .pr{font:800 14px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font:800 9.5px 'Plus Jakarta Sans',system-ui,sans-serif;letter-spacing:.08em;color:var(--acc);margin-bottom:1px}
.ex{display:inline-block;font:800 9.5px 'Plus Jakarta Sans',system-ui,sans-serif;letter-spacing:.08em;color:var(--goldInk);background:var(--goldSoft);padding:2px 6px;border-radius:6px;vertical-align:2px}

.fab{position:absolute;right:16px;bottom:80px;width:58px;height:58px;border-radius:50%;background:var(--accBtn);color:var(--accOn);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.22);animation:bob 1.6s ease-in-out infinite;z-index:5;transition:background-color .25s}
.fab svg{width:28px;height:28px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.tabs{position:absolute;left:0;right:0;bottom:0;height:64px;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:6;padding-bottom:4px}
.tabs.lift{z-index:33}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font:700 10.5px 'Plus Jakarta Sans',system-ui,sans-serif;transition:color .25s}
.tab .pl{padding:3px 16px;border-radius:999px;transition:background-color .25s}
.tab svg{width:21px;height:21px}
.tab.act{color:var(--acc)}
.tab.act .pl{background:var(--accSoft)}
.tab .lbl i{font-style:normal;border-radius:6px;padding:0 3px}
.tabs.flash .chg i{animation:chg 1.4s ease-out}
@keyframes chg{0%{background:transparent}25%{background:var(--acc);color:var(--accOn)}100%{background:transparent}}
.tabs.sweep .tab{animation:sweep 3.2s both}
.tabs.sweep .tab:nth-child(2){animation-delay:.5s}.tabs.sweep .tab:nth-child(3){animation-delay:1s}.tabs.sweep .tab:nth-child(4){animation-delay:1.5s}.tabs.sweep .tab:nth-child(5){animation-delay:2s}
@keyframes sweep{0%{color:var(--muted);transform:none}6%,14%{color:var(--acc);transform:translateY(-3px)}20%,100%{color:var(--muted);transform:none}}

.scrim{position:absolute;inset:0;background:rgba(6,8,10,.62);opacity:0;transition:opacity .25s;z-index:30;pointer-events:none}
.scrim.on{opacity:1}
.ring{position:absolute;z-index:31;left:180px;top:380px;width:0;height:0;border:2.5px solid var(--acc);border-radius:14px;opacity:0;pointer-events:none;
  box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 28%,transparent),0 0 0 2000px rgba(6,8,10,.62);
  transition:left .36s cubic-bezier(.2,.8,.2,1),top .36s cubic-bezier(.2,.8,.2,1),width .36s cubic-bezier(.2,.8,.2,1),height .36s cubic-bezier(.2,.8,.2,1),border-radius .36s,opacity .25s,border-color .25s}
.ring.on{opacity:1}
.ring::after{content:'';position:absolute;inset:-3px;border-radius:inherit;border:2px solid var(--acc);opacity:0}
.ring.arrive::after{animation:halo .6s ease-out .36s 2}
@keyframes halo{0%{opacity:.75;inset:-3px}100%{opacity:0;inset:-16px}}

.coach{position:absolute;left:12px;right:12px;z-index:40;background:var(--surface);border:1px solid var(--cardBorder);border-radius:22px;padding:13px 15px 14px;box-shadow:0 18px 40px rgba(0,0,0,.28);opacity:0;transform:translateY(10px);transition:opacity .25s,transform .36s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.coach.on{opacity:1;transform:none;pointer-events:auto}
.coach.top{top:98px}.coach.mid{top:300px}.coach.bottom{bottom:82px}
.coach.swap .cin{animation:cswap .3s ease-out}
.coach.shake{animation:shake .4s ease-in-out}
@keyframes cswap{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{translate:0}20%{translate:-6px}40%{translate:6px}60%{translate:-4px}80%{translate:4px}}
.cm{display:flex;align-items:center;gap:8px;font:700 11.5px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--muted)}
.dots{display:flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .36s cubic-bezier(.2,1.4,.4,1),background-color .25s}
.dots i.past{background:color-mix(in srgb,var(--acc) 45%,var(--line))}
.dots i.cur{width:18px;background:var(--acc)}
.cm .sk{margin-left:auto;font:700 12.5px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--muted);padding:6px 2px 6px 10px;cursor:pointer}
.coach h6{font:800 17px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);margin:7px 0 3px;letter-spacing:-.3px}
.coach p{font:400 13.5px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--text);margin:0}
.cf{display:flex;align-items:center;justify-content:space-between;margin-top:10px;min-height:30px}
.cta{display:inline-flex;align-items:center;gap:7px;font:800 13px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--acc);background:var(--accSoft);padding:6px 11px 6px 8px;border-radius:999px}
.cta .tp{width:16px;height:16px;border-radius:50%;border:2px solid var(--acc);position:relative}
.cta .tp::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--acc)}
.cta .tp::before{content:'';position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--acc);animation:tpp 1.2s ease-out 2}
@keyframes tpp{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(2)}}
.nb{margin-left:auto;background:var(--accBtn);color:var(--accOn);font:800 13px 'Plus Jakarta Sans',system-ui,sans-serif;padding:8px 18px;border-radius:999px}

.finger{position:absolute;z-index:50;left:300px;top:840px;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(255,255,255,.38);border:2px solid rgba(255,255,255,.95);box-shadow:0 4px 14px rgba(0,0,0,.35);opacity:0;pointer-events:none;
  transition:left .55s cubic-bezier(.3,.7,.2,1),top .55s cubic-bezier(.3,.7,.2,1),opacity .2s}
.finger.on{opacity:1;animation:fh 1.1s ease-in-out .55s infinite}
@keyframes fh{0%,100%{transform:scale(1)}50%{transform:scale(.76)}}
.tr{position:absolute;z-index:55;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:color-mix(in srgb,var(--acc) 40%,transparent);pointer-events:none;animation:trp .45s ease-out forwards}
@keyframes trp{to{transform:scale(3.2);opacity:0}}
.pressed{filter:brightness(.9)}

.toast{position:absolute;top:46px;left:50%;z-index:45;transform:translate(-50%,-14px);opacity:0;background:var(--ink);color:var(--bg);font:700 13px 'Plus Jakarta Sans',system-ui,sans-serif;padding:9px 14px 9px 10px;border-radius:999px;display:flex;align-items:center;gap:7px;white-space:nowrap;transition:opacity .25s,transform .36s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast i{width:20px;height:20px;border-radius:50%;background:var(--acc);display:grid;place-items:center}
.toast i svg{width:12px;height:12px;color:#fff}

.sheetbox{position:absolute;inset:0;z-index:20;pointer-events:none}
.sheetbox.on{pointer-events:auto}
.sheetbox .bk{position:absolute;inset:0;background:rgba(6,8,10,.45);opacity:0;transition:opacity .25s}
.sheetbox .sh{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 20px 24px;transform:translateY(105%);transition:transform .36s cubic-bezier(.2,.8,.2,1),opacity .3s}
.sheetbox.on .bk{opacity:1}.sheetbox.on .sh{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.pbtn{height:50px;border-radius:999px;background:var(--accBtn);color:var(--accOn);font:800 15px 'Plus Jakarta Sans',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;transition:background-color .25s}
.gbtn{height:44px;border-radius:999px;color:var(--muted);font:700 14px 'Plus Jakarta Sans',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer}
.obtn{height:48px;border-radius:999px;border:1.5px solid var(--line);color:var(--ink);font:800 14.5px 'Plus Jakarta Sans',system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
.rv{opacity:0;transform:translateY(6px);transition:opacity .25s,transform .3s cubic-bezier(.2,.8,.2,1)}
.rv.on{opacity:1;transform:none}
.lab{font:700 10.5px 'Plus Jakarta Sans',system-ui,sans-serif;letter-spacing:.12em;color:var(--muted);margin:14px 0 6px}

.logo{width:72px;height:72px;border-radius:50%;background:var(--accSoft);color:var(--acc);display:grid;place-items:center;margin:4px auto 12px;position:relative}
.logo svg{width:38px;height:38px}
.rip{position:absolute;inset:0;border-radius:50%;border:2px solid var(--acc);opacity:0}
.on .rip{animation:rip 1.2s ease-out both}
.on .rip:nth-child(2){animation-delay:.25s}.on .rip:nth-child(3){animation-delay:.5s}
@keyframes rip{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(2.1)}}
.start .sh h5,.done h5,.onb h5,.endc h5{font:800 21px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);text-align:center;margin:0 0 6px;letter-spacing:-.5px}
.start .sh p,.done p,.endc p{font:400 13.5px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--text);text-align:center;margin:0 6px 16px}
.foot{font:500 11.5px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--muted);text-align:center;margin-top:6px}

.post .sh,.job .sh{top:252px}
.post.sent .sh{transform:translateY(30%) scale(.25);opacity:0;transition:transform .45s cubic-bezier(.5,0,.75,0),opacity .4s}
.hrow{display:flex;align-items:center;gap:8px}
.hrow b{font:800 18px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);letter-spacing:-.4px}
.hrow .ex{margin-left:auto}
.field{border:1.5px solid var(--acc);border-radius:14px;padding:12px 13px;min-height:50px;font:600 15px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);transition:border-color .25s}

const CANCEL = Symbol('cancel'), SKIP = Symbol('skip');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const S = { answer: 'hire', run: 0, waiting: null, p: null, bonus: false, chosen: 1, offer: 600, remote: false };

function rectIn(p, el) {
  const s = p.querySelector('.screen');
  const a = s.getBoundingClientRect(), b = el.getBoundingClientRect();
  const k = a.width / s.offsetWidth || 1;
  return { x: (b.left - a.left) / k, y: (b.top - a.top) / k, w: b.width / k, h: b.height / k, k, a };
}

// The verbs every stop uses. tap() waits for the person to tap the lit-up thing;
// side taps listed in `extras` (an offer stepper, a different offer) act without moving on.
function api(p, id) {
  const q = s => p.querySelector(s);
  const live = () => { if (S.run !== id) throw CANCEL; };
  const x = {
    q,
    rect: s => rectIn(p, q(s)),
    async wait(ms) { await sleep(ms); live(); },
    mode(m) { p.dataset.mode = m; },
    on(s) { q(s).classList.add('on'); },
    off(s) { q(s).classList.remove('on'); },
    cls(s, c, v = true) { q(s).classList.toggle(c, v); },
    spot(s, { pad = 6, r = 16 } = {}) {
      const R = rectIn(p, q(s)), ring = q('.ring');
      Object.assign(ring.style, { left: R.x - pad + 'px', top: R.y - pad + 'px', width: R.w + pad * 2 + 'px', height: R.h + pad * 2 + 'px', borderRadius: r + 'px' });
      ring.classList.remove('arrive'); void ring.offsetWidth; ring.classList.add('on', 'arrive');
    },
    spotOff() { q('.ring').classList.remove('on', 'arrive'); },
    scrim(v) { q('.scrim').classList.toggle('on', v); },
    coach({ n, title, body, cta, next, pos = 'top' }) {
      const total = S.bonus ? 3 : 5, k = S.bonus ? n - 1 : n;
      const dots = Array.from({ length: total }, (_, i) => `<i class="${i + 1 < k ? 'past' : i + 1 === k ? 'cur' : ''}"></i>`).join('');
      const c = q('.coach');
      c.querySelector('.cin').innerHTML =
        `<div class="cm">${S.bonus ? 'Earning side · ' : ''}Step ${k} of ${total} <span class="dots">${dots}</span><span class="sk" role="button">Skip</span></div>
         <h6>${title}</h6><p>${body}</p>
         <div class="cf">${cta ? `<span class="cta"><span class="tp"></span>${cta}</span>` : '<span></span>'}${next ? `<span class="nb" role="button">${next}</span>` : ''}</div>`;
      c.className = 'coach on ' + pos;
      void c.offsetWidth; c.classList.add('swap');
    },
    coachOff() { q('.coach').classList.remove('on'); },
    toast(t) { q('.toast .tt').textContent = t; x.on('.toast'); },
    toastOff() { x.off('.toast'); },
    async type(s, text) {
      const el = q(s);
      for (let i = 1; i <= text.length; i++) { el.textContent = text.slice(0, i); await x.wait(45); }
    },
    point(s) {
      const R = rectIn(p, q(s)), f = q('.finger');
      f.style.left = R.x + R.w / 2 + 'px'; f.style.top = R.y + R.h / 2 + 'px';
      f.classList.add('on');
    },
    tap(sel, extras = {}) {
      live();
      return new Promise((resolve, reject) => {
        const els = [...p.querySelectorAll(sel)];
        els.forEach(e => e.classList.add('tgt'));
        const hintT = setTimeout(() => S.waiting && S.waiting.id === id && x.point(sel), 5000);
        S.waiting = {
          id, sel, extras, hint: () => x.point(sel),
          done(v, err) {
            clearTimeout(hintT);
            els.forEach(e => e.classList.remove('tgt'));
            q('.finger').classList.remove('on');
            S.waiting = null;
            err ? reject(err) : resolve(v);
          }
        };
      });
    }
  };
  return x;
}

}

async function play() {
  const id = ++S.run;
  if (S.waiting) { S.waiting.done(null, CANCEL); }
  S.bonus = false; S.chosen = 1; S.offer = 600; S.remote = false;
  const base = S.answer === 'earn' ? 'earn' : 'hire';
  const host = document.getElementById('stage');
  host.innerHTML = phoneHTML(base);
  const p = host.querySelector('.phone');
  S.p = p;
  wire(p);
  const x = api(p, id);
  try {
    await x.tap('.onb .gobtn');
    x.cls('.onb', 'gone');
    await x.wait(300);
    await STOPS.start(x);
    await STOPS.sides(x, base);
    if (base === 'hire') { await STOPS.post(x); await STOPS.offers(x); await STOPS.money(x); }
    else { await STOPS.find(x); await STOPS.picked(x); await STOPS.paid(x); }
    await STOPS.around(x, base);
    let r = await finish(x, base);
    if (r === 'bonus') {
      x.off('.done'); x.scrim(false);
      resetPractice(p);
      S.bonus = true;
      x.mode('earn');
      x.toast('Switched to Earn for this part');
      await x.wait(1400); x.toastOff();
      await STOPS.find(x); await STOPS.picked(x); await STOPS.paid(x);
      x.mode(base);
      x.toast('Back to Hire, as you were');
      await x.wait(1300); x.toastOff();
      r = await finish(x, base);
    }
    showEnd(p, 'That’s the whole tour', `In the app, “${r}” would open now, in the mode the person started in. The tour is marked as seen on this device, so it isn't offered again. They can replay it from the photo menu.`);
  } catch (e) {
    if (e === CANCEL) return;
    if (e !== SKIP) throw e;
    p.dataset.mode = base;
    ['.coach', '.ring', '.start', '.post', '.job', '.banner', '.offers', '.thread', '.vault', '.done', '.scrim', '.toast'].forEach(s => p.querySelector(s).classList.remove('on'));
    showEnd(p, 'Tour skipped', 'The tour closes and the person stays on Home in the mode they started in. It is marked as seen on this device and can be replayed from the photo menu.');
  }
}

function ripple(p, ev) {
  const s = p.querySelector('.screen'), a = s.getBoundingClientRect(), k = a.width / s.offsetWidth || 1;
  const d = document.createElement('span');
  d.className = 'tr';
  d.style.left = (ev.clientX - a.left) / k + 'px';
  d.style.top = (ev.clientY - a.top) / k + 'px';
  s.appendChild(d);
  setTimeout(() => d.remove(), 500);
}

function nudge(p) {
  const c = p.querySelector('.coach');
  c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
  if (S.waiting) S.waiting.hint();
}

function wire(p) {
  p.querySelector('.screen').addEventListener('click', ev => {
    ripple(p, ev);
    const t = ev.target;
    if (t.closest('.endc .e-again')) return play();
    if (t.closest('.endc .e-other')) return setAnswer(t.closest('.e-other').dataset.next);
    const w = S.waiting;
    if (!w) return;
    if (t.closest('.coach .sk, .start .skipnow')) return w.done(null, SKIP);
    for (const [sel, fn] of Object.entries(w.extras)) {
      const hit = t.closest(sel);
      if (hit && !hit.matches(w.sel)) return fn(hit);
    }
    const hit = t.closest(w.sel);
    if (hit) {
      hit.classList.add('pressed');
      setTimeout(() => hit.classList.remove('pressed'), 160);
      return w.done(hit);
    }
    nudge(p);
  });
}

addEventListener('keydown', ev => {
  const w = S.waiting;
  if (!w) return;
  if (ev.key === 'Escape') w.done(null, SKIP);
  if (ev.key === 'Enter' && !ev.target.closest('button')) { const el = S.p.querySelector(w.sel); if (el) w.done(el); }
});

function setAnswer(a) {
  S.answer = a;
  document.querySelectorAll('[data-a]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.a === a)));
  play();
}
document.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => setAnswer(b.dataset.a)));
document.getElementById('restart').addEventListener('click', () => play());

function fit() {
  const narrow = innerWidth < 560;
  document.body.classList.toggle('bare', narrow);
  document.getElementById('help').hidden = narrow;
  const w = narrow ? 360 : 380, h = narrow ? 760 : 780;
  const wrap = document.getElementById('stagewrap');
  const availW = document.body.clientWidth - 32;
  const top = wrap.getBoundingClientRect().top;
  const availH = innerHeight - top - 12;
  const k = Math.max(0.4, Math.min(availW / w, availH / h, 1.15));
  document.getElementById('stage').style.transform = `scale(${k})`;
  wrap.style.width = w * k + 'px';
  wrap.style.height = h * k + 'px';
}
addEventListener('resize', fit);
fit();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { fit(); play(); });
</script>
