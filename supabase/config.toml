# Which Edge Functions require a Supabase session.
#
# Two of these are called by things that have no session and cannot have one,
# so they must be public — and each secures itself by another means:
#
#   phone-auth       is how you sign in, so requiring a session is circular.
#                    It rate-limits by phone number and burns the code on use.
#   razorpay-webhook is called by Razorpay's servers. Every request is
#                    HMAC-SHA256 signed with RAZORPAY_WEBHOOK_SECRET and
#                    anything that does not verify is refused before a row is
#                    touched.
#
# razorpay itself acts on the caller's own wallet and task, so it keeps JWT
# verification on.

[functions.phone-auth]
verify_jwt = false

[functions.razorpay]
verify_jwt = true

[functions.razorpay-webhook]
verify_jwt = false

[functions.password-auth]
verify_jwt = false

# api is the app's door for writes and money. It runs every operation as the
# signed-in caller, so it needs a real session.
[functions.api]
verify_jwt = true

# app-config tells the app what the admin panel has switched (maintenance,
# minimum version, banner, features). It is read before anyone has signed in
# and holds nothing secret, so there is no JWT to check; the api function
# enforces the same switches on every call.
[functions.app-config]
verify_jwt = false

# Inngest calls this to run scheduled and event-driven jobs. It is not a user
# session, so the platform JWT check is off; the function verifies Inngest's
# own signature (INNGEST_SIGNING_KEY) on every request instead.
[functions.inngest]
verify_jwt = false

# ---------------------------------------------------------------------------
# Auth settings that the project needs, kept here so they are reviewed like code.
#
# The cloud project is the only Supabase there is (no local stack), and its auth settings were
# set by hand in the dashboard. Do NOT run `supabase config push` for it: that sends every
# [auth] value in this file and would replace settings we have not captured here. Changes go
# in with `node scripts/add-redirect-urls.mjs --apply`, which only ever ADDS addresses to
# the allow-list. `supabase db start` (CI) ignores this section.
#
# Where sign-in may send people back to after Google (or a magic link): the old app's address
# stays on the list until Phase 9, so the old app and old admin keep working.
# ---------------------------------------------------------------------------
[auth]
additional_redirect_urls = [
  "https://taskdrop.in",
  "https://taskdrop.in/**",
  "https://www.taskdrop.in",
  "https://www.taskdrop.in/**",
  "https://taskdrop-admin.vercel.app/auth/callback",
  "http://localhost:8081",
  "http://localhost:8081/**",
  "http://localhost:3001/auth/callback",
]
