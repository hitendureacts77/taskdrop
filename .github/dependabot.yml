# Weekly pull requests for dependency updates, and immediate ones for any
# package with a published security advisory. CI (npm audit, typecheck, tests,
# the SQL suite) runs on each, so an update that breaks something shows up red
# instead of being merged blind.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Expo pins matching versions of many packages; updating them one by one
      # produces a pile of PRs that can each only fail.
      expo:
        patterns: ["expo", "expo-*", "@expo/*", "react-native", "react-native-*", "@react-native*"]
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
