name: Plan site

# Publishes docs/ (the plan page and the files it links to) to the private
# Cloudflare address in "Start here" of docs/ULTIMATE_PLAN.md (task 1.19 row Q).
# Cloudflare Access lets only the owner's email in.

on:
  push:
    branches: [redesigned-2.0]
    paths:
      - 'docs/**'
      - 'plan-site/**'
      - '.github/workflows/plan-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plan-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs
            plan-site
      - name: Build the site folder
        run: |
          mkdir -p plan-site/public
          cp -r docs/. plan-site/public/
          cp docs/ULTIMATE_PLAN.html plan-site/public/index.html
          cp plan-site/_headers plan-site/public/_headers
          echo "Files: $(find plan-site/public -type f | wc -l)"
      - name: Deploy to Cloudflare
        working-directory: plan-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PLAN_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.166.0 deploy
