name: Plan site

# Publishes the plan page to the private Cloudflare Pages address in
# "Start here" of docs/ULTIMATE_PLAN.md (task 1.19 row Q). Cloudflare Access
# lets only the owner's email in (one-time code). Deploy-only token, Pages edit.

on:
  push:
    branches: [redesigned-2.0]
    paths:
      - 'docs/ULTIMATE_PLAN.html'
      - 'docs/DEBUGGING_PLAN.html'
      - 'docs/architecture/*.html'
      - 'plan-site/**'
      - '.github/workflows/plan-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plan-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs
            plan-site
      - name: Build the site folder
        run: |
          mkdir -p plan-site/public/architecture
          cp docs/ULTIMATE_PLAN.html plan-site/public/index.html
          cp docs/ULTIMATE_PLAN.html docs/DEBUGGING_PLAN.html plan-site/public/
          cp docs/architecture/*.html plan-site/public/architecture/
          cp plan-site/_headers plan-site/404.html plan-site/public/
          find plan-site/public -type f | wc -l
      - name: Deploy to Cloudflare Pages
        # Run inside plan-site/: from the repo root wrangler tries to detect the
        # npm workspace and stops. The project already exists on classic Pages,
        # so no --force is needed.
        working-directory: plan-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PLAN_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: >
          npx --yes wrangler@4.166.0 pages deploy public
          --project-name taskdrop-plan --branch main
          --commit-hash "$GITHUB_SHA" --commit-dirty=true
