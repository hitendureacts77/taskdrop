name: CI

# The P0 fixes in migration 045 are only fixes for as long as something keeps
# checking. Until this existed, `npm run check` and `npm run test:db` were
# enforced by memory alone.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run check

      # Fails on any new advisory at moderate or above, and on any critical one. The few
      # that cannot be fixed yet are listed with a reason and a review date in
      # audit-exceptions.json (scripts/audit-gate.mjs), instead of leaving CI red for good.
      - name: npm audit
        run: npm run audit:gate

  functions:
    name: Edge Functions type-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Pinned to a full commit (v2.0.5): this job runs third-party code.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      # The Inngest function runs on Deno, which the Node unit tests do not cover.
      # --node-modules-dir=none keeps Deno away from the repo's npm workspace.
      - name: type-check the Inngest function
        run: deno check --node-modules-dir=none supabase/functions/inngest/index.ts

  # Ground rule 4 (docs/UPGRADE_PLAN.md): until Phase 9 the old app (`main`) shares the database
  # and the `api` function with the upgrade. This runs the operations the old app calls through
  # both versions of `api` and fails if the new one refuses what the old accepted or answers with
  # fewer fields. Its database half is a step of the `database` job below.
  compatibility:
    name: old app still works (api contract)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: old-main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:contract
        env:
          OLD_APP_DIR: ${{ github.workspace }}/old-main

  database:
    name: money and access rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: old-main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # The seed and old-app database checks are Node scripts that use the `pg` driver.
      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Brings up a throwaway Postgres with the auth schema, the anon and
      # authenticated roles, and every migration in supabase/migrations applied
      # in order. The SQL tests need all three -- they call auth.uid() and they
      # assert on grants held by those roles.
      - name: start local supabase
        run: supabase db start

      - name: run the SQL suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npm run test:db

      # The seed that resets the test project must load cleanly on a fresh database.
      - name: load the fake-data seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npm run test:seed

      # Ground rule 4 (docs/UPGRADE_PLAN.md): the old app shares this database until Phase 9.
      # Everything its server code reads and calls must still be here after our migrations.
      - name: old app still has its tables and functions
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          OLD_APP_DIR: ${{ github.workspace }}/old-main
        run: node scripts/check-old-app-db.mjs

      - name: stop
        if: always()
        run: supabase stop --no-backup
