name: Deploy to the test project

# Phase 0 (R2): a merge into redesigned-2.0 puts the backend on the shared test project
# (wjxvingpfbfvkfqhrguj): new migrations, then the Edge Functions, then the Inngest sync.
# The web app and the admin deploy through Vercel's own GitHub link; app updates for
# phones go through EAS Update (Phase 1).
#
# The old app and the old admin share this project until Phase 9, so before anything is
# deployed the old-app contract is checked again (docs/DEPLOY.md), and after the migrations the
# old app's tables and functions are checked on the real database.
#
# Needs these in GitHub -> Settings -> Secrets and variables -> Actions (docs/DEPLOY.md):
#   SUPABASE_ACCESS_TOKEN   to deploy Edge Functions (supabase.com -> Account -> Access Tokens)
#   TEST_DATABASE_URL       the test project's Session pooler connection string, with its password
# Without them the run stops with a notice and deploys nothing.

on:
  push:
    branches: [redesigned-2.0]
    paths:
      - 'supabase/**'
      - 'packages/**'
      - 'scripts/deploy-migrations.mjs'
      - 'scripts/check-old-app-db.mjs'
      - '.github/workflows/deploy-test.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer merge waits for the running one instead of cancelling it half way.
concurrency:
  group: deploy-test-project
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: wjxvingpfbfvkfqhrguj

jobs:
  deploy:
    name: migrations, functions, Inngest sync
    runs-on: ubuntu-latest
    environment: test-project
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    steps:
      - name: check the secrets are set
        id: ready
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$DATABASE_URL" ]; then
            echo "::warning title=Nothing deployed::Add the SUPABASE_ACCESS_TOKEN and TEST_DATABASE_URL secrets (docs/DEPLOY.md), then run this workflow again."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.ready.outputs.ready == 'true'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.ready.outputs.ready == 'true'
        with:
          ref: main
          path: old-main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        if: steps.ready.outputs.ready == 'true'

      # 1. Would this break the old app? Stop before touching the project if so.
      - name: old app contract (api)
        if: steps.ready.outputs.ready == 'true'
        run: npm run test:contract
        env:
          OLD_APP_DIR: ${{ github.workspace }}/old-main

      # 2. Migrations the project has not seen yet (scripts/deploy-migrations.mjs says why not `db push`).
      - name: apply new migrations
        if: steps.ready.outputs.ready == 'true'
        run: node scripts/deploy-migrations.mjs

      - name: old app still has its tables and functions
        if: steps.ready.outputs.ready == 'true'
        run: node scripts/check-old-app-db.mjs
        env:
          OLD_APP_DIR: ${{ github.workspace }}/old-main

      # 3. Edge Functions. verify_jwt per function comes from supabase/config.toml.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: steps.ready.outputs.ready == 'true'
        with:
          version: latest
      - name: deploy Edge Functions
        if: steps.ready.outputs.ready == 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api

      # 4. Tell Inngest Cloud to re-read the function list. The request is signed on the way back,
      #    so no secret is needed; the address is fixed here so a run cannot be pointed elsewhere.
      #    Reported as a warning, not a failure, until the Inngest Cloud keys are set (docs/INNGEST.md):
      #    by then the code is already deployed and a red run would only hide that.
      - name: Inngest sync
        if: steps.ready.outputs.ready == 'true'
        continue-on-error: true
        env:
          FUNCTION_URL: https://wjxvingpfbfvkfqhrguj.supabase.co/functions/v1/inngest
        run: |
          set -euo pipefail
          out=$(curl --fail-with-body -sS -X PUT "$FUNCTION_URL")
          echo "$out"
          echo "$out" | grep -q "Successfully registered"
