name: Release to production

# Plan decision 57 (27 Nov 2026, docs/ULTIMATE_PLAN.md "The 3-day finish"): production moves as ONE release.
# Until that day the production websites rebuilt on every merge while the production database waited for an
# Approve click; a run that sat waiting from 23 Nov left the database 33 migrations behind its own website.
#
# This is the only way a change reaches production. Run it by hand: Actions -> Release to production ->
# Run workflow, branch redesigned-2.0. In order:
#
#   1. guard     the branch is redesigned-2.0, and staging already runs this commit: the last green
#                "Deploy (staging backend + web)" run is this commit, or differs from it only in docs.
#   2. database  production-database.yml: migrations, first-day safety, Edge Functions, function secrets,
#                Inngest sync, first-day checks. It still waits for the owner's Approve on the environment
#                `production-database` while the repository is public (docs/RELEASE.md section 4).
#   3. web       the production website, built for production and uploaded to the Cloudflare Worker
#                `taskdrop-production` (web-deploy.yml). Skips with a notice until the Cloudflare secrets are set
#                (plan 5.12 step 2); until then the production website is still built by Vercel on each merge.
#   4. check     the production server and the production website both answer.
#   5. record    a tag production-<date>-<time> on the released commit, so "what is in production" has one answer.
#
# A failure in a step stops every step after it. The admin has its own repository and its own release.

on:
  workflow_dispatch:

# One release at a time. A second click waits for the first; it never cuts a migration run in half.
concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: staging already runs this commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: redesigned-2.0 only
        run: |
          if [ "$GITHUB_REF" != "refs/heads/redesigned-2.0" ]; then echo "::error::Releases run from redesigned-2.0 only."; exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the last green staging deploy is this commit (docs aside)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          staged=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-staging.yml/runs?branch=redesigned-2.0&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
          if [ -z "$staged" ]; then echo "::error::No green staging deploy found. Staging must run a commit before production gets it."; exit 1; fi
          echo "last green staging deploy: $staged"
          echo "this release:              $GITHUB_SHA"
          if [ "$staged" = "$GITHUB_SHA" ]; then exit 0; fi
          if ! git cat-file -e "$staged^{commit}" 2>/dev/null; then echo "::error::The staging commit is not in this branch's history."; exit 1; fi
          if ! git merge-base --is-ancestor "$staged" "$GITHUB_SHA"; then echo "::error::This commit is older than what staging runs. Release the branch tip."; exit 1; fi
          # deploy-staging.yml ignores pushes that only touch docs, so those may differ.
          if ! git diff --quiet "$staged" "$GITHUB_SHA" -- . ':(exclude)docs' ':(exclude,glob)**/*.md'; then
            echo "::error::Staging has not finished deploying this commit. Wait for 'Deploy (staging backend + web)' to go green, then run this again."
            git diff --stat "$staged" "$GITHUB_SHA" -- . ':(exclude)docs' ':(exclude,glob)**/*.md' | tail -15
            exit 1
          fi
          echo "Only docs differ from the staging commit."

  database:
    name: database and server code
    needs: guard
    uses: ./.github/workflows/production-database.yml
    # No secrets are passed: the called job reads them from its own environment, production-database.

  web:
    name: website
    needs: database
    uses: ./.github/workflows/web-deploy.yml
    with:
      target: production
    # Only the two repository secrets it needs (no `secrets: inherit`); the EXPO_PUBLIC_* values are
    # environment secrets of web-production, which the called job reads itself.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  check:
    name: production answers
    needs: [database, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Repository variable PRODUCTION_WEB_URL: the production website's address. Set it to the Cloudflare
      # address once the Worker is live (plan 5.12), and to https://taskdrop.in at launch (decision 28).
      WEB_URL: ${{ vars.PRODUCTION_WEB_URL || 'https://taskdrop-production.vercel.app' }}
      SERVER_URL: https://dyzskuzqcqbexssyrrxc.supabase.co/functions/v1/app-config
    steps:
      - name: the production server and website answer
        run: |
          fail=0
          for url in "$SERVER_URL" "$WEB_URL"; do
            code=000
            for i in 1 2 3; do
              code=$(curl -sS -o /dev/null --max-time 30 -w '%{http_code}' "$url" || true)
              if [ "$code" = "200" ]; then break; fi
              sleep $((10 * i))
            done
            echo "$url -> $code"
            if [ "$code" != "200" ]; then echo "::error::$url answered $code"; fail=1; fi
          done
          exit $fail

  record:
    name: tag the release
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: tag production-<date>-<time>
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="production-$(date -u +%Y%m%d-%H%M)"
          if gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" --silent; then
            echo "Released $GITHUB_SHA as $tag" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Production was released, but the tag $tag could not be written."
          fi
