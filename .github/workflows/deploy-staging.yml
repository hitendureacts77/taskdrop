name: Deploy (staging backend + web)

# Plan task 5.12 (22 Nov 2026): what the Vercel build of `redesigned-2.0` used to do, in the same order.
#   1. backend         the staging Supabase project: old-app contract, migrations, old-app DB check,
#                      Edge Functions, Inngest sync (scripts/deploy-staging-backend.mjs). Any failure stops
#                      the staging web deploy, so the web app never goes live against a half-updated backend.
#   2. web-staging     builds the web app for staging and uploads it to the Cloudflare Worker `taskdrop-staging`.
# Production is not deployed here. It moves as one release (database, server code, website) from
# release-production.yml, run by hand (plan decision 57, 27 Nov 2026).
# The web jobs skip with a notice until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set as repository
# secrets and scripts/cloudflare-web-build.mjs exists. Docs-only pushes deploy nothing.
# Secrets: environment `staging-backend` (SUPABASE_ACCESS_TOKEN, DATABASE_URL); environment `web-staging`
# (the EXPO_PUBLIC_* values, set by scripts/sync-github-env.mjs from .env.all-secrets).

on:
  push:
    branches: [redesigned-2.0]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of cutting a migration run in half.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    name: staging backend
    # A manual run from any other branch must not put that branch's migrations or functions on staging.
    if: github.ref == 'refs/heads/redesigned-2.0'
    runs-on: ubuntu-latest
    environment: staging-backend
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true # the script fetches `main` for the two old-app checks

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: deploy the staging backend
        run: node scripts/deploy-staging-backend.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  web-staging:
    needs: backend
    uses: ./.github/workflows/web-deploy.yml
    with:
      target: staging
    # Each secret by name (no `secrets: inherit`): the two Cloudflare repository secrets, and the build values,
    # which are environment secrets of web-staging.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_VARIANT: ${{ secrets.APP_VARIANT }}
      EXPO_PUBLIC_APP_ENV: ${{ secrets.EXPO_PUBLIC_APP_ENV }}
      EXPO_PUBLIC_APP_URL: ${{ secrets.EXPO_PUBLIC_APP_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_SENDER_ID }}
      EXPO_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.EXPO_PUBLIC_RECAPTCHA_SITE_KEY }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      EXPO_PUBLIC_SENTRY_ENVIRONMENT: ${{ secrets.EXPO_PUBLIC_SENTRY_ENVIRONMENT }}
      EXPO_PUBLIC_SENTRY_REPLAY_RATE: ${{ secrets.EXPO_PUBLIC_SENTRY_REPLAY_RATE }}
      EXPO_PUBLIC_LEGAL_ENTITY: ${{ secrets.EXPO_PUBLIC_LEGAL_ENTITY }}
      EXPO_PUBLIC_LEGAL_ADDRESS: ${{ secrets.EXPO_PUBLIC_LEGAL_ADDRESS }}
      EXPO_PUBLIC_LEGAL_EMAIL: ${{ secrets.EXPO_PUBLIC_LEGAL_EMAIL }}
      EXPO_PUBLIC_LEGAL_JURISDICTION: ${{ secrets.EXPO_PUBLIC_LEGAL_JURISDICTION }}
      EXPO_PUBLIC_LEGAL_REVIEWED: ${{ secrets.EXPO_PUBLIC_LEGAL_REVIEWED }}
      EXPO_PUBLIC_GRIEVANCE_OFFICER_NAME: ${{ secrets.EXPO_PUBLIC_GRIEVANCE_OFFICER_NAME }}
      EXPO_PUBLIC_GRIEVANCE_OFFICER_EMAIL: ${{ secrets.EXPO_PUBLIC_GRIEVANCE_OFFICER_EMAIL }}
      EXPO_PUBLIC_COPYRIGHT_AGENT_NAME: ${{ secrets.EXPO_PUBLIC_COPYRIGHT_AGENT_NAME }}
      EXPO_PUBLIC_COPYRIGHT_AGENT_EMAIL: ${{ secrets.EXPO_PUBLIC_COPYRIGHT_AGENT_EMAIL }}
      EXPO_PUBLIC_COPYRIGHT_AGENT_ADDRESS: ${{ secrets.EXPO_PUBLIC_COPYRIGHT_AGENT_ADDRESS }}
      EXPO_PUBLIC_COPYRIGHT_AGENT_PHONE: ${{ secrets.EXPO_PUBLIC_COPYRIGHT_AGENT_PHONE }}
      SENTRY_AUTH_TOKEN_TASKDROP_USERAPP: ${{ secrets.SENTRY_AUTH_TOKEN_TASKDROP_USERAPP }}

